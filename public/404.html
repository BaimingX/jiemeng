<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Oneiro AI</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="description" content="The page you requested does not exist." />
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1d2440 0%, #0b0f19 55%, #05080f 100%);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 480px;
      padding: 24px;
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      line-height: 1.2;
    }
    p {
      margin: 0 0 20px;
      color: #94a3b8;
    }
    a {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      background: #6366f1;
    }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page may have moved or the URL may be incorrect.</p>
    <a href="/">Back to Home</a>
  </main>
</body>
</html>
